<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medicine Details | MediCare</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="header"><div class="container nav"><a class="brand" href="index.html"><span>✚</span> MediCare</a><button class="menu-btn" id="menuBtn">☰</button><nav id="navMenu"><a href="index.html">Home</a><div class="medicine-dropdown-wrap"><a href="medicines.html">Medicines <span class="medicine-chevron">⌄</span></a><div class="medicine-dropdown"><a href="medicines.html" data-system="Dermatology / Skin Care">Derma <b>›</b></a><a href="medicines.html" data-system="Gastro-Intestinal Tract">Gastro-Intestinal Tract <b>›</b></a><a href="medicines.html" data-system="Circulatory System">Circulatory System <b>›</b></a><a href="medicines.html" data-system="Others">Others <b>›</b></a><a href="medicines.html" data-system="Endocrine System">Endocrine System <b>›</b></a><a href="medicines.html" data-system="Eyes , Nose , Ear">Eyes , Nose , Ear <b>›</b></a><a href="medicines.html" data-system="Urinary Tract System">Urinary Tract System <b>›</b></a><a href="medicines.html" data-system="Central Nervous System">Central Nervous System <b>›</b></a><a href="medicines.html" data-system="Respiratory Tract System">Respiratory Tract System <b>›</b></a><a href="medicines.html" data-system="Cardio-Vascular System">Cardio-Vascular System <b>›</b></a></div></div><a href="doctors.html">Doctor Guidance</a><a href="prescription.html">Prescription</a><a href="contact.html">Contact</a></nav><div class="nav-actions"><button class="icon-btn" onclick="location.href='cart.html'">🛒 <b id="cartCount">0</b></button></div></div></header>
<main class="container page" id="details"></main>
<footer class="footer"><div class="container copyright">© 2026 MediCare Pharmacy</div></footer>
<script src="js/data.js"></script><script src="js/app.js"></script><script>
const id=new URLSearchParams(location.search).get('id'); const p=products.find(x=>x.id===id)||products[0];
document.title=p.name+' | MediCare';
document.getElementById('details').innerHTML=`
<div class="breadcrumbs"><a href="medicines.html">Medicines</a> / ${p.name}</div>
<div class="details-grid"><div class="medicine-visual"><img src="${p.image}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="image-fallback">${p.icon}</span></div><div><span class="badge">${p.category}</span><h1>${p.name}</h1><p class="generic">Generic / active ingredient: <b>${p.generic}</b></p><div class="rating">★★★★★ <small>4.8 customer rating</small></div><div class="price big">Rs. ${p.price.toLocaleString()}</div><p>${p.short}</p><p><b>Availability:</b> <span class="stock">In stock</span></p><div class="qty"><button onclick="changeQty(-1)">−</button><span id="qty">1</span><button onclick="changeQty(1)">+</button><button class="btn primary" onclick="addFromDetails()">Add to cart</button></div></div></div>
<div class="medical-info"><div><h2>Uses & general information</h2><p>${p.uses}</p></div><div><h2>Safety guidance</h2><p>${p.guidance}</p></div><div><h2>Possible side effects</h2><p>${p.effects}</p></div><div><h2>Warnings</h2><p>${p.warnings}</p></div></div>
<div class="disclaimer"><b>⚠ Medical information notice</b><p>This page is for general educational information. It is not a diagnosis or a substitute for advice from a doctor or pharmacist. Follow the product label and professional instructions. Seek urgent medical care for serious or rapidly worsening symptoms.</p></div>`;
let q=1; function changeQty(n){q=Math.max(1,q+n);document.getElementById('qty').textContent=q} function addFromDetails(){addToCart(p.id,q)}
</script></body></html>
