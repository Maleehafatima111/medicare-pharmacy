<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | MediCare</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="header"><div class="container nav"><a class="brand" href="index.html"><span>✚</span> MediCare</a></div></header>
<main class="container page"><div class="page-title"><span class="eyebrow">SECURE CHECKOUT</span><h1>Complete your order</h1></div><div class="form-layout"><form id="checkoutForm" class="form-card"><h2>Delivery details</h2><label>Full name<input required name="name"></label><label>Phone number<input required name="phone"></label><label>Delivery address<textarea required name="address"></textarea></label><label>Payment method<select name="payment"><option>Cash on Delivery</option><option>Card Payment</option></select></label><button class="btn primary full">Place order</button></form><aside class="summary"><h2>Your items</h2><div id="checkoutSummary"></div></aside></div></main>
<script src="js/data.js"></script><script src="js/app.js"></script><script>
const c=getCart(), s=document.getElementById('checkoutSummary');let total=0;s.innerHTML=c.map(i=>{let p=products.find(x=>x.id===i.id);total+=p.price*i.qty;return `<p>${p.name} × ${i.qty}<b>Rs. ${(p.price*i.qty).toLocaleString()}</b></p>`}).join('')+`<hr><p class="total">Total <b>Rs. ${(total+150).toLocaleString()}</b></p>`;
document.getElementById('checkoutForm').onsubmit=e=>{e.preventDefault();let order={id:'MC'+Date.now().toString().slice(-6),date:new Date().toLocaleDateString(),total:total+150,status:'Processing'};localStorage.setItem('mc_last_order',JSON.stringify(order));localStorage.removeItem('mc_cart');location.href='orders.html'};
</script></body></html>
